services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    volumes:
       - kafka_data:/var/lib/kafka/data
  
  postgres:
    image: postgres:15
    container_name: postgresbd
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: transactions_db
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true 
    depends_on:
      - postgres
    volumes:
      - ./services/grafana/dashboards:/var/lib/grafana/dashboards
      - ./services/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./services/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources


  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    ports:
      - "8080:5000"            # Host 8080 -> Contenedor 5000
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --serve-artifacts
      --artifacts-destination /mlruns 

  producer:
    container_name: producer
    build: ./app/producer
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    volumes:
      - ./app/producer:/app
    environment:
      - KAFKA_BROKER=kafka:9092

  consumer:
    container_name: consumer
    build: ./app/consumer
    ports:
      - "8082:8080"
    depends_on:
      - kafka
      - postgres
      - mlflow
    volumes:
      - ./app/consumer:/app
    env_file: ./app/consumer/.env 
    environment:
      - KAFKA_BROKER=kafka:9092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=transactions_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password


volumes:
  grafana-storage:
  mlflow_data:
  mlflow_artifacts:
  postgres_data:
  kafka_data:
  zookeeper_data: